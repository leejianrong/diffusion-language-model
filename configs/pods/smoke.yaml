# GPU smoke run (DLM-19). Worst case = max_hourly_usd * max_lifetime_secs / 3600 = $1.20.
name: dlm-smoke
image: runpod/pytorch:2.8.0-py3.11-cuda12.8.1-cudnn-devel-ubuntu22.04
job_file: scripts/pod_job.sh
gpu: {id: NVIDIA A100-SXM4-80GB, count: 1}
cloud: COMMUNITY
max_hourly_usd: 1.60
max_lifetime_secs: 2700
idle_timeout_secs: 1500
idle_check_secs: 60
exit_grace_secs: 120
disk_gb: 80
env:
  GIT_REF: main
