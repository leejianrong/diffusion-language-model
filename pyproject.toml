[project]
name = "dlm"
version = "0.0.1"
description = "A from-scratch masked diffusion language model, benchmarked against an autoregressive baseline."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
    "tiktoken>=0.8",
    "torch>=2.5",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]
report = ["matplotlib>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlm"]

# CPU-only torch for local dev and CI. GPU pods install the CUDA wheel separately (see CLAUDE.md).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[project.scripts]
dlm = "dlm.cli:main"

[[tool.mypy.overrides]]
module = ["pyarrow.*", "tiktoken.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs real infra (network, GPU, pod); excluded from the fast gate"]
